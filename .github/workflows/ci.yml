name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned so that the lint rules and formatting style do not drift between runs.
      - run: pip install "ruff==0.17.0"
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Installs the package the way users do (not editable), so packaging mistakes
      # such as missing model files or undeclared dependencies fail the build.
      - run: pip install ".[test]" pytest-cov
      # Bare --cov uses [tool.coverage.run] in pyproject.toml, which measures the
      # installed package; --cov=chelate would measure the unused source directory.
      - name: Run tests with coverage
        run: >
          pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
